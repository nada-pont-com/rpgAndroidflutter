name: rpg_flutter
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  path_provider: "^2.0.0"
  sqflite:  ^2.4.1
  provider: ^6.0.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter_native_splash:
  color: "#ababab"
  image: "icon/sig-512.png"

flutter_icons:
  image_path: "icon/sig-512.png"
  android: true
  ios: true
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

flutter:

  uses-material-design: true

  assets:
    - assets/sig-512.png
